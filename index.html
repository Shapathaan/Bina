<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Independent Help Portal</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="page">

    <!-- Desktop -->
    <img
        src="hero.jpg"
        class="background desktop-bg"
        alt="Independent help portal"
    >

    <!-- Mobile -->
    <img
        src="hero-mobile.jpg"
        class="background mobile-bg"
        alt="Independent help portal"
    >

    <!-- Clickable email -->
    <a
        class="email-button"
        href="mailto:EMAIL@DOMAIN.COM"
        aria-label="Contact by email"
    >
        EMAIL@DOMAIN.COM
    </a>

</main>

</body>
</html>
