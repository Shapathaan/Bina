<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Independent Help Portal</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="page">

    <!-- Vertical mobile artwork -->
    <img
        src="hero.png"
        class="background"
        alt=""
    >

    <!-- Dark subtle overlay -->
    <div class="overlay"></div>

    <!-- Top notice -->
    <div class="notice">
        UNOFFICIAL • INDEPENDENT WEBSITE
    </div>

    <!-- Text content -->
    <section class="content">

        <p class="description">
            Bu web sitesi bir yardım portalıdır, herhangi bir sorunuz için
            lütfen aşağıdaki e-posta adresinden bizimle iletişime geçin.
        </p>

        <a
            href="mailto:EMAIL@DOMAIN.COM"
            class="email"
        >
            EMAIL@DOMAIN.COM
        </a>

    </section>

</main>

<script src="script.js"></script>

</body>
</html>
